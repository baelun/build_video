[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storybook-video"
version = "0.1.0"
description = "有聲故事書影片製作：故事 → 分鏡 → 圖片 → 人工確認 → 有聲影片 → 合成"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
storybook = "storybook_video.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/storybook_video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
